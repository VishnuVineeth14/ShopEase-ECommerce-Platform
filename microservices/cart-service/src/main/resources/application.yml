server:
  port: 8083

spring:
  application:
    name: cart-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/shopease_cart_db}
      database: shopease_cart_db

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  services:
    product: ${PRODUCT_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
